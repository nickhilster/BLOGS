<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Absorb Complexity. Preserve Agency.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07050f"/>
      <stop offset="100%" stop-color="#0b0920"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="85" rx="150" ry="110" fill="#ec4899" fill-opacity="0.08" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Signature mark -->
  <g fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5">
    <polygon points="506,92 552,116 506,140 460,116" fill="#8b5cf6" fill-opacity="0.14"/>
    <polygon points="460,140 506,164 552,140 506,116" fill="#8b5cf6" fill-opacity="0.08"/>
    <polygon points="460,164 506,188 552,164 506,140" fill="#8b5cf6" fill-opacity="0.05"/>
    <circle cx="506" cy="116" r="6" fill="#8b5cf6" fill-opacity="0.75" stroke="none"/>
  </g>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="110" height="22" rx="11" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="117.0" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#fbcfe8" fill-opacity="0.92">DESIGN ETHIC</text>
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Absorb Complexity.</text>
  <text x="62" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Preserve Agency.</text>
  <rect x="62" y="214" width="300" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#ec4899" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#blend)" fill-opacity="0.12"/>
</svg>
