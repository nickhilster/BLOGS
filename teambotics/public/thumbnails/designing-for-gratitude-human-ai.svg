<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Designing for Gratitude in Human-AI Interaction">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a04"/>
      <stop offset="100%" stop-color="#130c04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="clip"><rect width="640" height="360"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <ellipse cx="560" cy="85" rx="150" ry="110" fill="#f59e0b" fill-opacity="0.08" filter="url(#blur)" clip-path="url(#clip)"/>
  <!-- Signature mark -->
  <g fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5">
    <circle cx="470" cy="140" r="20"/>
    <circle cx="542" cy="140" r="20"/>
    <path d="M490 140 h32" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M506 128 c4-8 14-8 14 0 c0 8-14 14-14 14 s-14-6-14-14 c0-8 10-8 14 0" fill="#fb923c" fill-opacity="0.6" stroke="none"/>
    <circle cx="470" cy="140" r="6" fill="#fb923c" fill-opacity="0.5" stroke="none"/>
    <circle cx="542" cy="140" r="6" fill="#f59e0b" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Left accent bar -->
  <rect x="48" y="60" width="4" height="240" rx="2" fill="url(#accent)" fill-opacity="0.35"/>
  <!-- Tag -->
  <rect x="62" y="68" width="117" height="22" rx="11" fill="#fb923c" fill-opacity="0.1" stroke="#fb923c" stroke-width="0.75" stroke-opacity="0.4"/>
  <text x="120.5" y="83" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#fde68a" fill-opacity="0.92">HUMAN MEANING</text>
  <text x="62" y="148" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Designing for</text>
  <text x="62" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Gratitude</text>
  <rect x="62" y="214" width="250" height="4" rx="2" fill="url(#accent)" fill-opacity="0.7"/>
  <!-- Subtitle -->
  <text x="62" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="400" fill="#94a3b8">respecting the gestures people bring</text>
  <!-- Branding -->
  <text x="62" y="320" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#f59e0b" fill-opacity="0.55">TEAMBOTICS</text>
  <rect x="48" y="335" width="544" height="1" rx="0.5" fill="url(#blend)" fill-opacity="0.12"/>
</svg>
