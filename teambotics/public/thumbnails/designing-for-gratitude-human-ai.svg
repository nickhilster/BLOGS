    <path d="M18 14h70v102H18z" fill="#efdbb7"/>
    <path d="M92 14h70v102H92z" fill="#f8edda"/>
    <path d="M90 14v102" stroke="#af865d" stroke-width="3"/>
    <path d="M34 42h38M34 54h40M108 42h38M108 54h38" stroke="#aa8661" stroke-width="3"/>
  </g>
