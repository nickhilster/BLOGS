<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Designing for gratitude in human–AI interaction</title>
  <desc id="desc">A warm paper field with three human-made tools connected by a fine, open line.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#f4e8d4"/>
      <stop offset="1" stop-color="#ddc5a1"/>
