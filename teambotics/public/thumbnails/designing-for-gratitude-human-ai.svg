    <linearGradient id="ink" x2="1">
      <stop stop-color="#865035"/>
      <stop offset="1" stop-color="#b87849"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".6" fill="#76543b" opacity=".18"/>
      <circle cx="7" cy="6" r=".45" fill="#fff9ed" opacity=".65"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grain)" opacity=".36"/>
  <path d="M96 82H1104V548H96z" fill="none" stroke="#76543b" stroke-opacity=".25"/>
  <path d="M190 400C350 330 440 330 590 382S850 436 1010 320" fill="none" stroke="#8f674b" stroke-width="2" stroke-dasharray="3 12"/>
