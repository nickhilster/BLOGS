name: Deploy NikDesign Blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nikdesign/**'
      - '.github/workflows/deploy-nikdesign.yml'

concurrency:
  group: nikdesign-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_OWwjnhbor7MbYnw2kUlbr28r
      VERCEL_PROJECT_ID: prj_5RCKoilPLxVjr9QZLxuZQ0ZXltuG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nikdesign/package-lock.json
      - run: npm ci
        working-directory: nikdesign
      - run: npx --yes vercel pull --yes --environment=production --local-config ./nikdesign/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel build --prod --local-config ./nikdesign/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel deploy --prebuilt --prod --local-config ./nikdesign/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify published article on production domain
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          import urllib.error
          url = "https://blog.nikdesign.ca/posts/software-is-art-feels-like-home/"
          last = None
          for attempt in range(8):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "NikDesign-Deploy-Verify/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      status = response.status
                  if status == 200 and "Software Is Art" in body and "Feels Like Home" in body:
                      print(f"Verified article: {url} ({status})")
                      break
                  last = f"HTTP {status}; expected article markers missing"
              except Exception as exc:
                  last = str(exc)
              print(f"Attempt {attempt + 1}: {last}")
              if attempt < 7:
                  time.sleep(10)
          else:
              raise SystemExit(f"Production article verification FAILED: {url}: {last}")
          PY
