name: Deploy TeamBotics Blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'teambotics/**'
      - '.github/workflows/deploy-teambotics.yml'

concurrency:
  group: teambotics-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_OWwjnhbor7MbYnw2kUlbr28r
      VERCEL_PROJECT_ID: prj_tOVrx6Jpn6ubAs9F1XLD8utLoWyJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teambotics/package-lock.json
      - run: npm ci
        working-directory: teambotics
      - run: npx --yes vercel pull --yes --environment=production --local-config ./teambotics/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel build --prod --local-config ./teambotics/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel deploy --prebuilt --prod --local-config ./teambotics/vercel.json --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
