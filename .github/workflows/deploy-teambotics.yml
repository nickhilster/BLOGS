name: Deploy TeamBotics Blog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'teambotics/**'
      - '.github/workflows/deploy-teambotics.yml'

concurrency:
  group: teambotics-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teambotics
    env:
      VERCEL_ORG_ID: team_OWwjnhbor7MbYnw2kUlbr28r
      VERCEL_PROJECT_ID: prj_tOVrx6Jpn6ubAs9F1XLD8utLoWyJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teambotics/package-lock.json
      - run: npm ci
      - run: npx --yes vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare Vercel project root for the checked-out app directory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.vercel/project.json';
          const project = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`Pulled Vercel rootDirectory: ${project.rootDirectory ?? '<unset>'}`);
          console.log(`/bin/sh available: ${fs.existsSync('/bin/sh')}`);
          if (project.rootDirectory) {
            delete project.rootDirectory;
            fs.writeFileSync(path, `${JSON.stringify(project, null, 2)}\n`);
            console.log('Removed rootDirectory from job-local Vercel metadata.');
          }
          NODE
      - run: npx --yes vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
